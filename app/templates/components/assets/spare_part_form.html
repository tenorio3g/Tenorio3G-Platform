<form
    method="post"
    class="spare-part-form"
>

    <div class="technical-data-form__grid">

        <div class="form-field">

            <label for="code">
                Código
            </label>

            {% if relation %}

                <input
                    id="code"
                    type="text"
                    value="{{ relation.spare_part.code }}"
                    disabled
                >

            {% else %}

                <input
                    id="code"
                    type="text"
                    name="code"
                    required
                >

            {% endif %}

        </div>


        <div class="form-field">

            <label for="name">
                Nombre
            </label>

            <input
                id="name"
                type="text"
                name="name"
                value="{% if relation %}{{ relation.spare_part.name }}{% endif %}"
                required
            >

        </div>


        <div class="form-field">

            <label for="manufacturer">
                Fabricante
            </label>

            <input
                id="manufacturer"
                type="text"
                name="manufacturer"
                value="{% if relation %}{{ relation.spare_part.manufacturer }}{% endif %}"
            >

        </div>


        <div class="form-field">

            <label for="part_number">
                Número de parte
            </label>

            <input
                id="part_number"
                type="text"
                name="part_number"
                value="{% if relation %}{{ relation.spare_part.part_number }}{% endif %}"
            >

        </div>


        <div class="form-field">

            <label for="unit">
                Unidad
            </label>

            <input
                id="unit"
                type="text"
                name="unit"
                value="{% if relation %}{{ relation.spare_part.unit }}{% else %}pieza{% endif %}"
            >

        </div>


        <div class="form-field">

            <label for="quantity">
                Cantidad instalada
            </label>

            <input
                id="quantity"
                type="number"
                name="quantity"
                step="0.01"
                min="0.01"
                value="{% if relation %}{{ relation.quantity }}{% else %}1{% endif %}"
                required
            >

        </div>


        <div class="form-field">

            <label for="position">
                Posición
            </label>

            <input
                id="position"
                type="text"
                name="position"
                value="{% if relation %}{{ relation.position }}{% endif %}"
            >

        </div>

    </div>


    <div class="form-field">

        <label for="observations">
            Observaciones
        </label>

        <textarea
            id="observations"
            name="observations"
            rows="4"
        >{% if relation %}{{ relation.observations }}{% endif %}</textarea>

    </div>


    <label class="spare-part-form__critical">

        <input
            type="checkbox"
            name="is_critical"
            {% if relation and relation.is_critical %}
                checked
            {% endif %}
        >

        Refacción crítica

    </label>


    <footer class="technical-data-form__actions">

        <a
            class="btn"
            href="{{ url_for(
                'assets.asset_detail',
                codigo=codigo
            ) }}"
        >
            Cancelar
        </a>

        <button
            class="btn btn-primary"
            type="submit"
        >

            {% if relation %}
                Guardar cambios
            {% else %}
                Guardar refacción
            {% endif %}

        </button>

    </footer>

</form>
