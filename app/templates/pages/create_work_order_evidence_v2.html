{% extends "layouts/base.html" %}

{% block title %}
Registrar evidencia - {{ orden.code }}
{% endblock %}

{% block content %}

<div class="container">

    <article class="asset-workspace-card">

        <div class="asset-workspace-card__header">

            <div>

                <p class="asset-workspace-card__eyebrow">
                    Orden de trabajo
                </p>

                <h3>
                    Registrar evidencia
                </h3>

                <p>
                    {{ orden.code }} · {{ orden.title }}
                </p>

            </div>

        </div>

        <div class="asset-workspace-card__body">

            {% if error %}

                <div class="form-alert form-alert-error">
                    {{ error }}
                </div>

            {% endif %}

            <form
                method="post"
                enctype="multipart/form-data"
            >

                <div class="form-grid">

                    <div class="form-field">

                        <label for="title">
                            Título
                        </label>

                        <input
                            id="title"
                            name="title"
                            type="text"
                            required
                            value="{{ data.get('title', '') if data else '' }}"
                            placeholder="Ej. Contactor dañado"
                        >

                    </div>

                    <div class="form-field">

                        <label for="evidence_type">
                            Tipo de evidencia
                        </label>

                        <select
                            id="evidence_type"
                            name="evidence_type"
                            required
                        >

                            {% set evidence_type_labels = {
                                'BEFORE_PHOTO': 'Foto antes',
                                'AFTER_PHOTO': 'Foto después',
                                'MEASUREMENT': 'Medición',
                                'DOCUMENT': 'Documento',
                                'OTHER': 'Otro'
                            } %}

                            {% for type in evidence_types %}

                                <option
                                    value="{{ type.value }}"
                                    {% if data and data.get('evidence_type') == type.value %}
                                        selected
                                    {% endif %}
                                >
                                    {{ evidence_type_labels.get(
                                        type.value,
                                        type.value
                                    ) }}
                                </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="form-field">

                        <label for="activity_code">
                            Actividad
                        </label>

                        <select
                            id="activity_code"
                            name="activity_code"
                        >

                            <option value="">
                                Sin actividad específica
                            </option>

                            {% for activity in activities.items %}

                                <option
                                    value="{{ activity.code }}"
                                    {% if data and data.get('activity_code') == activity.code %}
                                        selected
                                    {% endif %}
                                >
                                    {{ activity.code }} · {{ activity.title }}
                                </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="form-field form-field-full">

                        <label for="description">
                            Descripción
                        </label>

                        <textarea
                            id="description"
                            name="description"
                            rows="4"
                        >{{ data.get('description', '') if data else '' }}</textarea>

                    </div>

                    <div class="form-field form-field-full">

                        <label for="evidence_file">
                            Archivo
                        </label>

                        <input
                            id="evidence_file"
                            name="evidence_file"
                            type="file"
                            accept=".jpg,.jpeg,.png,.pdf"
                            required
                        >

                    </div>

                </div>

                <div class="form-actions">

                    <button
                        type="submit"
                        class="button button-primary"
                    >
                        Registrar evidencia
                    </button>

                    <a
                        class="button button-secondary"
                        href="{{ url_for(
                            'work_orders.detalle',
                            numero=orden.code
                        ) }}"
                    >
                        Cancelar
                    </a>

                </div>

            </form>

        </div>

    </article>

</div>

{% endblock %}
