{% extends "layouts/base.html" %}

{% block title %}
Nueva Orden de Trabajo
{% endblock %}

{% block content %}

<div class="asset-card">

    <p class="asset-label">
        WORK ORDERS
    </p>

    <h1>
        📋 Nueva Orden de Trabajo
    </h1>

    <p>
        Registre la información inicial de la orden.
    </p>

    <hr>

    {% if error %}

        <div class="form-alert form-alert-error">
            {{ error }}
        </div>

    {% endif %}

    <form
        method="POST"
        class="work-order-form"
    >

        <div class="form-grid">

            <div class="form-field">

                <label for="numero">
                    Número de orden
                </label>

                <input
                    id="numero"
                    name="numero"
                    type="text"
                    required
                    value="{{ datos.get('numero', '') if datos else '' }}"
                    placeholder="Ej. 70150"
                >

            </div>

            <div class="form-field">

                <label for="titulo">
                    Título
                </label>

                <input
                    id="titulo"
                    name="titulo"
                    type="text"
                    required
                    value="{{ datos.get('titulo', '') if datos else '' }}"
                    placeholder="Descripción breve del trabajo"
                >

            </div>

            <div class="form-field form-field-full">

                <label for="descripcion">
                    Descripción
                </label>

                <textarea
                    id="descripcion"
                    name="descripcion"
                    rows="5"
                    placeholder="Explique el trabajo solicitado"
                >{{ datos.get('descripcion', '') if datos else '' }}</textarea>

            </div>

            <div class="form-field">

                <label for="tipo">
                    Tipo
                </label>

                <select
                    id="tipo"
                    name="tipo"
                    required
                >
                    <option value="Correctivo">
                        Correctivo
                    </option>

                    <option value="Preventivo">
                        Preventivo
                    </option>

                    <option value="Proyecto">
                        Proyecto
                    </option>

                    <option value="Inspección">
                        Inspección
                    </option>
                </select>

            </div>

            <div class="form-field">

                <label for="prioridad">
                    Prioridad
                </label>

                <select
                    id="prioridad"
                    name="prioridad"
                    required
                >
                    <option value="Baja">
                        Baja
                    </option>

                    <option value="Media">
                        Media
                    </option>

                    <option value="Alta">
                        Alta
                    </option>

                    <option value="Crítica">
                        Crítica
                    </option>
                </select>

            </div>

            <div class="form-field">

                <label for="codigo_activo">
                    Activo
                </label>

                <select
                    id="codigo_activo"
                    name="codigo_activo"
                    required
                >

                    <option value="">
                        Seleccione un activo
                    </option>

                    {% for asset in assets %}

                        <option
                            value="{{ asset.code }}"
                            {% if datos
                                and datos.get('codigo_activo') == asset.code %}
                                selected
                            {% endif %}
                        >
                            {{ asset.name }} — {{ asset.code }}
                        </option>

                    {% endfor %}

                </select>

            </div>
            <div class="form-field">

                <label for="numero_solicitante">
                    Solicitante
                </label>

                <select
                    id="numero_solicitante"
                    name="numero_solicitante"
                    required
                >

                    <option value="">
                        Seleccione un solicitante
                    </option>

                    {% for person in people %}

                        {% if person.is_active %}

                            <option
                                value="{{ person.code }}"
                                {% if datos
                                    and datos.get('numero_solicitante') == person.code %}
                                    selected
                                {% endif %}
                            >
                                {{ person.name }} — {{ person.code }}
                            </option>

                        {% endif %}

                    {% endfor %}

                </select>

            </div>

            <div class="form-field">

                <label for="numero_supervisor">
                    Supervisor
                </label>

                <select
                    id="numero_supervisor"
                    name="numero_supervisor"
                    required
                >

                    <option value="">
                        Seleccione un supervisor
                    </option>

                    {% for person in people %}

                        {% if person.is_active %}

                            <option
                                value="{{ person.code }}"
                                {% if datos
                                    and datos.get('numero_supervisor') == person.code %}
                                    selected
                                {% endif %}
                            >
                                {{ person.name }} — {{ person.code }}
                            </option>

                        {% endif %}

                    {% endfor %}

                </select>

            </div>

        </div>

        <div class="form-actions">

            <button
                type="submit"
                class="button button-primary"
            >
                Crear Orden
            </button>

            <a
                href="{{ url_for('operations.index') }}"
                class="button button-secondary"
            >
                Cancelar
            </a>

        </div>

    </form>

</div>

{% endblock %}
