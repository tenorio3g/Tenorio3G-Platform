{% extends "layouts/base.html" %}

{% block content %}

<div class="page-header">

    <div>
        <p class="page-header__eyebrow">
            Photos Engine
        </p>

        <h1>
            Registrar fotografía
        </h1>

        <p>
            Activo:
            <strong>{{ codigo }}</strong>
        </p>
    </div>

</div>

<form
    method="post"
    enctype="multipart/form-data"
    class="form-card"
>

    <div class="form-group">

        <label for="code">
            Código de la fotografía
        </label>

        <input
            id="code"
            name="code"
            type="text"
            required
            placeholder="PHOTO-ES09-002"
        >

    </div>

    <div class="form-group">

        <label for="title">
            Título
        </label>

        <input
            id="title"
            name="title"
            type="text"
            required
            placeholder="Placa de datos ES09"
        >

    </div>

    <div class="form-group">

        <label for="photo_type">
            Tipo de fotografía
        </label>

        <select
            id="photo_type"
            name="photo_type"
            required
        >
            <option value="">
                Seleccione...
            </option>

            <option value="general">
                Foto general
            </option>

            <option value="nameplate">
                Placa de datos
            </option>

            <option value="component">
                Componente
            </option>

            <option value="failure">
                Falla
            </option>

            <option value="before">
                Antes del mantenimiento
            </option>

            <option value="after">
                Después del mantenimiento
            </option>

            <option value="installation">
                Instalación
            </option>

            <option value="inspection">
                Inspección
            </option>

        </select>

    </div>

    <div class="form-group">

        <label for="photo_file">
            Imagen
        </label>

        <input
            id="photo_file"
            name="photo_file"
            type="file"
            accept=".jpg,.jpeg,.png,image/jpeg,image/png"
            required
        >

    </div>

    <div class="form-group">

        <label for="description">
            Descripción
        </label>

        <textarea
            id="description"
            name="description"
            rows="4"
            placeholder="Descripción de la fotografía..."
        ></textarea>

    </div>

    <div class="form-actions">

        <a
            href="{{ url_for(
                'assets.asset_detail',
                codigo=codigo
            ) }}"
            class="btn"
        >
            Cancelar
        </a>

        <button
            type="submit"
            class="btn btn-primary"
        >
            Registrar fotografía
        </button>

    </div>

</form>

{% endblock %}
