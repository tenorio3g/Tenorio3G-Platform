{% extends "layouts/base.html" %}

{% block content %}

<section class="page-section">

    <div class="page-header">

        <div>
            <p class="page-header__eyebrow">
                Documents Engine
            </p>

            <h1>
                Registrar documento técnico
            </h1>

            <p>
                Activo:
                <strong>
                    {{ codigo }}
                </strong>
            </p>
        </div>

    </div>

    <form
        method="post"
        enctype="multipart/form-data"
        class="form-card"
    >

        <div class="form-group">

            <label for="code">
                Código del documento
            </label>

            <input
                id="code"
                name="code"
                type="text"
                required
                placeholder="DOC-ES09-003"
            >

        </div>

        <div class="form-group">

            <label for="title">
                Título
            </label>

            <input
                id="title"
                name="title"
                type="text"
                required
                placeholder="Manual del tablero ES09"
            >

        </div>

        <div class="form-group">

            <label for="document_type">
                Tipo de documento
            </label>

            <select
                id="document_type"
                name="document_type"
                required
            >
                <option value="">
                    Seleccione...
                </option>

                <option value="manual">
                    Manual
                </option>

                <option value="electrical_diagram">
                    Diagrama eléctrico
                </option>

                <option value="mechanical_drawing">
                    Plano mecánico
                </option>

                <option value="datasheet">
                    Ficha técnica
                </option>

                <option value="procedure">
                    Procedimiento
                </option>

                <option value="certificate">
                    Certificado
                </option>

                <option value="manufacturer_document">
                    Documento del fabricante
                </option>

            </select>

        </div>

        <div class="form-group">

            <label for="document_file">
                Archivo PDF
            </label>

            <input
                id="document_file"
                name="document_file"
                type="file"
                accept=".pdf,application/pdf"
                required
            >

        </div>
        </div>

        <div class="form-group">

            <label for="revision">
                Revisión
            </label>

            <input
                id="revision"
                name="revision"
                type="text"
                placeholder="A"
            >

        </div>

        <div class="form-group">

            <label for="description">
                Descripción
            </label>

            <textarea
                id="description"
                name="description"
                rows="4"
                placeholder="Descripción breve del documento..."
            ></textarea>

        </div>

        <div class="form-actions">

            <a
                href="{{ url_for(
                    'assets.asset_detail',
                    codigo=codigo
                ) }}"
                class="btn"
            >
                Cancelar
            </a>

            <button
                type="submit"
                class="btn btn-primary"
            >
                Registrar documento
            </button>

        </div>

    </form>

</section>

{% endblock %}
