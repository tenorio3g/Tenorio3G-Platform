{% extends "layouts/base.html" %}

{% block content %}

<section class="asset-form-page">

    <div class="asset-section-heading">

        <div>
            <p class="asset-section-heading__eyebrow">
                Identity
            </p>

            <h1>
                Iniciar sesión
            </h1>

            <p>
                Accede a Tenorio3G Platform
                con tu cuenta de usuario.
            </p>
        </div>

    </div>

    {% if error %}

        <div class="asset-workspace-card__placeholder">
            {{ error }}
        </div>

    {% endif %}

    <form
        method="post"
        class="spare-part-form"
    >

        <div>
            <label for="username">
                Usuario
            </label>

            <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                required
            >
        </div>

        <div>
            <label for="password">
                Contraseña
            </label>

            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
            >
        </div>

        <div class="spare-part-item__actions">

            <button
                type="submit"
                class="btn btn-primary"
            >
                Iniciar sesión
            </button>

        </div>

    </form>

</section>

{% endblock %}
