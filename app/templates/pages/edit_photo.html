{% extends "layouts/base.html" %}

{% block content %}

<div class="page-header">

    <div>
        <p class="page-header__eyebrow">
            Photos Engine
        </p>

        <h1>
            Editar fotografía
        </h1>

        <p>
            Activo:
            <strong>{{ codigo }}</strong>
        </p>

        <p>
            Fotografía:
            <strong>{{ photo.code }}</strong>
        </p>
    </div>

</div>

<form
    method="post"
    class="form-card"
>

    <div class="form-group">

        <label for="title">
            Título
        </label>

        <input
            id="title"
            name="title"
            type="text"
            required
            value="{{ photo.title }}"
        >

    </div>

    <div class="form-group">

        <label for="photo_type">
            Tipo de fotografía
        </label>

        <select
            id="photo_type"
            name="photo_type"
            required
        >

            <option
                value="general"
                {% if photo.photo_type == "general" %}
                    selected
                {% endif %}
            >
                Foto general
            </option>

            <option
                value="nameplate"
                {% if photo.photo_type == "nameplate" %}
                    selected
                {% endif %}
            >
                Placa de datos
            </option>

            <option
                value="component"
                {% if photo.photo_type == "component" %}
                    selected
                {% endif %}
            >
                Componente
            </option>

            <option
                value="failure"
                {% if photo.photo_type == "failure" %}
                    selected
                {% endif %}
            >
                Falla
            </option>

            <option
                value="before"
                {% if photo.photo_type == "before" %}
                    selected
                {% endif %}
            >
                Antes del mantenimiento
            </option>

            <option
                value="after"
                {% if photo.photo_type == "after" %}
                    selected
                {% endif %}
            >
                Después del mantenimiento
            </option>

            <option
                value="installation"
                {% if photo.photo_type == "installation" %}
                    selected
                {% endif %}
            >
                Instalación
            </option>

            <option
                value="inspection"
                {% if photo.photo_type == "inspection" %}
                    selected
                {% endif %}
            >
                Inspección
            </option>

        </select>

    </div>

    <div class="form-group">

        <label>
            Archivo actual
        </label>

        <input
            type="text"
            value="{{ photo.file_name }}"
            disabled
        >

    </div>

    <div class="form-group">

        <label for="description">
            Descripción
        </label>

        <textarea
            id="description"
            name="description"
            rows="4"
        >{{ photo.description }}</textarea>

    </div>

    <div class="form-actions">

        <a
            href="{{ url_for(
                'assets.asset_detail',
                codigo=codigo
            ) }}"
            class="btn"
        >
            Cancelar
        </a>

        <button
            type="submit"
            class="btn btn-primary"
        >
            Guardar cambios
        </button>

    </div>

</form>

{% endblock %}
