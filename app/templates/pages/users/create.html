{% extends "layouts/base.html" %}

{% block content %}

<section class="asset-form-page">

    <div class="asset-section-heading">

        <div>
            <p class="asset-section-heading__eyebrow">
                Identity
            </p>

            <h1>
                Registrar usuario
            </h1>

            <p>
                Crea una cuenta de acceso
                para una persona registrada.
            </p>
        </div>

    </div>


    <form
        method="post"
        class="spare-part-form"
    >

        <div>
            <label for="username">
                Usuario
            </label>

            <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                required
            >
        </div>


        <div>
            <label for="password">
                Contraseña
            </label>

            <input
                id="password"
                name="password"
                type="password"
                autocomplete="new-password"
                required
            >
        </div>


        <div>
            <label for="person_code">
                Persona
            </label>

            <select
                id="person_code"
                name="person_code"
                required
            >

                <option value="">
                    Seleccione una persona
                </option>

                {% for person in people %}

                    {% if person.is_active %}

                        <option
                            value="{{ person.code }}"
                        >
                            {{ person.name }}
                            — {{ person.code }}
                        </option>

                    {% endif %}

                {% endfor %}

            </select>
        </div>


        <div>
            <label for="role_code">
                Rol
            </label>

            <select
                id="role_code"
                name="role_code"
                required
            >

                <option value="">
                    Seleccione un rol
                </option>

                {% for role in roles %}

                    {% if role.is_active %}

                        <option
                            value="{{ role.code }}"
                        >
                            {{ role.name }}
                        </option>

                    {% endif %}

                {% endfor %}

            </select>
        </div>


        <div class="spare-part-item__actions">

            <a
                class="btn"
                href="{{ url_for(
                    'identity.users_index'
                ) }}"
            >
                Cancelar
            </a>

            <button
                type="submit"
                class="btn btn-primary"
            >
                Registrar usuario
            </button>

        </div>

    </form>

</section>

{% endblock %}
