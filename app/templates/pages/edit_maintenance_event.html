{% extends "layouts/base.html" %}

{% block content %}

<section class="asset-form-page">

    <div class="asset-section-heading">
        <div>
            <p class="asset-section-heading__eyebrow">
                Hoja de vida
            </p>

            <h1>
                Editar mantenimiento
            </h1>

            <p>
                Activo:
                <strong>{{ codigo }}</strong>
            </p>
        </div>
    </div>

    <form
        method="post"
        class="spare-part-form"
    >

        <div>
            <label>
                Código del evento
            </label>

            <input
                type="text"
                value="{{ event.code }}"
                disabled
            >
        </div>

        <div>
            <label for="event_type">
                Tipo de mantenimiento
            </label>

            <select
                id="event_type"
                name="event_type"
                required
            >
                {% for value, label in [
                    ('preventive', 'Preventivo'),
                    ('corrective', 'Correctivo'),
                    ('inspection', 'Inspección'),
                    ('repair', 'Reparación')
                ] %}
                    <option
                        value="{{ value }}"
                        {% if event.event_type == value %}
                            selected
                        {% endif %}
                    >
                        {{ label }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label for="title">
                Título
            </label>

            <input
                id="title"
                name="title"
                type="text"
                value="{{ event.title }}"
                required
            >
        </div>

        <div>
            <label for="performed_by">
                Realizado por
            </label>

            <input
                id="performed_by"
                name="performed_by"
                type="text"
                value="{{ event.performed_by }}"
                required
            >
        </div>

        <div>
            <label for="started_at">
                Inicio
            </label>

            <input
                id="started_at"
                name="started_at"
                type="datetime-local"
                value="{{
                    event.started_at.strftime(
                        '%Y-%m-%dT%H:%M'
                    )
                }}"
                required
            >
        </div>

        <div>
            <label for="completed_at">
                Finalización
            </label>

            <input
                id="completed_at"
                name="completed_at"
                type="datetime-local"
                value="{{
                    event.completed_at.strftime(
                        '%Y-%m-%dT%H:%M'
                    )
                    if event.completed_at
                    else ''
                }}"
            >
        </div>

        <div>
            <label for="description">
                Descripción
            </label>

            <textarea
                id="description"
                name="description"
                rows="4"
            >{{ event.description }}</textarea>
        </div>

        <div>
            <label for="observations">
                Observaciones
            </label>

            <textarea
                id="observations"
                name="observations"
                rows="4"
            >{{ event.observations }}</textarea>
        </div>

        <div class="spare-part-item__actions">

            <a
                class="btn"
                href="{{ url_for(
                    'assets.asset_detail',
                    codigo=codigo
                ) }}"
            >
                Cancelar
            </a>

            <button
                type="submit"
                class="btn btn-primary"
            >
                Guardar cambios
            </button>

        </div>

    </form>

</section>

{% endblock %}
